[project]
name = "taskhub"
version = "0.1.0"
description = "TaskHub - Task Management API"
readme = "README.md"
authors = [
    { name = "Nguyen Duy Han", email = "ngyuenduyhan235@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "email-validator>=2.0.0",
    "fastapi[standard]>=0.111",
    "greenlet>=3.5.6",
    "pwdlib[argon2]>=0.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
taskhub = "taskhub:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B009",  # Do not call getattr with a constant attribute value (generic BaseRepository attribute lookup)
    "UP046", # Generic class BaseRepository uses Generic subclass
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.fastapi]
entrypoint = "taskhub.main:app"
